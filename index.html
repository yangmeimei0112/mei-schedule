<!DOCTYPE html>
<html lang="zh-TW" data-design-theme="sky-glass" data-title-wrap="wrap">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F9FF" id="mei-theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="咩時光 MeiSchedule" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="咩時光 MeiSchedule — 咩創意工作室跨五端全能智慧排程與共享時間軸系統。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
    <link rel="preload" as="image" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/pwa-maskable.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var THEME_BG = {
            'sky-glass': { light: '#F4F9FF', dark: '#080E1A' },
            'minimal-linear': { light: '#FFFFFF', dark: '#0B0D12' },
            'warm-journal': { light: '#FAF6F0', dark: '#1C1917' }
          };
          var raw = window.localStorage && window.localStorage.getItem('mei_schedule_theme_boot_v1');
          var parsed = raw ? JSON.parse(raw) : null;
          var html = document.documentElement;
          var designTheme =
            parsed && typeof parsed.designTheme === 'string' && THEME_BG[parsed.designTheme]
              ? parsed.designTheme
              : 'sky-glass';
          html.setAttribute('data-design-theme', designTheme);
          var mode = parsed && parsed.colorMode ? parsed.colorMode : 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          html.classList.toggle('dark', Boolean(isDark));
          html.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.getElementById('mei-theme-color-meta');
          if (meta) {
            meta.setAttribute('content', THEME_BG[designTheme][isDark ? 'dark' : 'light']);
          }
        } catch (e) {}
      })();
    </script>
    <title>咩時光 MeiSchedule — 咩創意工作室</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      src="/sdk/mei-dock.js"
      data-hub-url="https://mei-creative-studio.vercel.app/"
      data-project-name="咩時光 MeiSchedule"
      data-position="bottom-right"
      defer
    ></script>
  </body>
</html>
