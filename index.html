<!DOCTYPE html>
<html lang="zh-TW" data-design-theme="sky-glass" data-title-wrap="wrap">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#38BDF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080E1A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="咩時光 MeiSchedule" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="咩時光 MeiSchedule — 咩創意工作室跨五端全能智慧排程與共享時間軸系統。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
    <link rel="preload" as="image" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/pwa-maskable.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = window.localStorage && window.localStorage.getItem('mei_schedule_theme_boot_v1');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var html = document.documentElement;
          if (parsed && typeof parsed.designTheme === 'string') {
            html.setAttribute('data-design-theme', parsed.designTheme);
          }
          var mode = parsed && parsed.colorMode;
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          html.classList.toggle('dark', Boolean(isDark));
        } catch (e) {}
      })();
    </script>
    <title>咩時光 MeiSchedule — 咩創意工作室</title>
  </head>
  <body class="antialiased selection:bg-sky-400/25 selection:text-sky-700 dark:selection:text-sky-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      src="/sdk/mei-dock.js"
      data-hub-url="https://mei-creative-studio.vercel.app/"
      data-project-name="咩時光 MeiSchedule"
      data-position="bottom-right"
      defer
    ></script>
  </body>
</html>
