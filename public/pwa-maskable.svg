<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F9FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pwaCardGrad" x1="116" y1="116" x2="396" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="pwaCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0284C7" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Full-bleed 晴空漸層底色確保任意形狀裁切 (iOS / Android Maskable Safe Area) 無透明破綻 -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)" />
  <!-- 咩時光 MeiSchedule 專屬晴空超橢圓 App Icon 卡片 (收容於 80% 安全可視區內) -->
  <rect x="116" y="116" width="280" height="280" rx="82" fill="url(#pwaCardGrad)" filter="url(#pwaCardShadow)" />
  <!-- 日曆時間塊 (Time Blocks) 純白高對比向量幾何標誌 -->
  <g transform="translate(169.6, 169.6) scale(7.2)" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="3.5" y="5.2" width="17" height="15.3" rx="4.2" />
    <path d="M8.2 3.2v2.4M15.8 3.2v2.4" />
    <rect x="6.6" y="9.4" width="7.6" height="2.7" rx="1.35" fill="#FFFFFF" stroke="none" />
    <rect x="9.8" y="14.1" width="7.6" height="2.7" rx="1.35" fill="#FFFFFF" fill-opacity="0.52" stroke="none" />
  </g>
</svg>
